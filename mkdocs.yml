site_name: The Roots of Japanese
site_description: Japanese as a system of combinable roots — like Latin and Greek in English
site_url: https://KakkoiDev.github.io/kanji-roots
repo_url: https://github.com/KakkoiDev/kanji-roots

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    logo: material/translate
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - header.autohide
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light/dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - ruby:
      global_enable: true
      title_enable: true
      outer_begin: '{'
      outer_end: '}'
      inter_begin: '('
      inter_end: ')'

extra_css:
  - assets/stylesheets/furigana.css

extra_javascript:
  - assets/javascripts/furigana-toggle.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KakkoiDev/kanji-roots

copyright: Copyright &copy; 2026 The Roots of Japanese

nav:
  - Home: index.md
  - Kanji Roots:
      - Catalog: kanji-roots-catalog.md
      - The Data: kanji-roots-data.md
  - Verb Roots: verb-roots.md
